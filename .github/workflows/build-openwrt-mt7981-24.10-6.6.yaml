name: Build OpenWrt-mt7981-24.10-6.6

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
  schedule:
    - cron: 0 14 * * 5

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: feeds.conf.default
  model: 360T7_6.6
  model2: cmcc_rax3000m_6.6
  CONFIG_FILE: config/MakeMenu.mt7981.24.10.6.6.config
  DIY_P1_SH: diy-batch1/diy-x86-part1.sh
  DIY_P2_SH: diy-batch2/diy-24.10-6.6-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  UPLOAD_ZZNAS: true
  ftp_username: ${{ secrets.FTP_USERNAME }}
  ftp_psw: ${{ secrets.FTP_PSW }}
  ftp_ip: ${{ secrets.FTP_IP }}
  TargetPath: OpenwrtImgs/mt7981/360T7_108M_24.10_6.6
  TargetPath2: OpenwrtImgs/mt7981/RAX3000M_NAND_6.6
  upload_file_1: immortalwrt-mediatek-filogic-qihoo_360t7_108M-initramfs-kernel.bin
  upload_file_2: immortalwrt-mediatek-filogic-qihoo_360t7_108M-squashfs-sysupgrade.bin
  upload_file_3: immortalwrt-mediatek-filogic-cmcc_rax3000m-initramfs-recovery.itb
  upload_file_4: immortalwrt-mediatek-filogic-cmcc_rax3000m-squashfs-sysupgrade.itb
  upload_file_5: sha256sums
  whkey: ${{ secrets.WEBHOOK }}

jobs:
  build:
    # 允许用 GITHUB_TOKEN 回写仓库文件（last_build.txt）
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest

    steps:
    - name: Check Server Hardware
      if: (!cancelled())
      run: |
        echo "警告⚠"
        echo "若分配的服务器性能不足，务必及时取消，重新运行！"
        echo "已知编译成功CPU型号：8370C,8171M"
        echo "已知性能不足CPU型号：8272CL,E5系列"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
        echo -e "CPU核心及版本信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        sudo lshw -short -C memory | grep GiB
        echo -e "\n"
        
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: "Optimize Disk Space"
      uses: "hugoalh/disk-space-optimizer-ghaction@v0.8.1"
      with:
        operate_sudo: "True"
        general_include: ".+"
        general_exclude: |-
          ^GCC$
          ^G\+\+$
          Clang
          LLVM
        docker_include: ".+"
        docker_prune: "True"
        docker_clean: "True"
        apt_prune: "True"
        apt_clean: "True"
        homebrew_prune: "True"
        homebrew_clean: "True"
        npm_prune: "True"
        npm_clean: "True"
        os_swap: "True"

#    - name: Freeing up disk space
#      uses: easimon/maximize-build-space@master
#      with: 
#        root-reserve-mb: 3072
#        swap-size-mb: 1
#        remove-dotnet: 'true'
#        remove-android: 'true'
#        remove-haskell: 'true'
#        remove-codeql: 'true'
#        remove-docker-images: 'true'

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="
        
    - name: Checkout
      uses: actions/checkout@main
      
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
        git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
        libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
        mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools \
        libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
        vim wget xmlto xxd zlib1g-dev python3-setuptools uwsgi uwsgi-plugin-python3 python3-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo chown $USER:$GROUPS $GITHUB_WORKSPACE

    - name: Switch GCC/GXX Version
      uses: xylz0928/SwitchUbuntuGccGxxVersion@v1.0.7
      with:
        TargetVer: '12'
        

    - name: Clone source code
      working-directory: ./
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf ./openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        send_dingding="curl -s \"https://oapi.dingtalk.com/robot/send?access_token=${whkey}\" -H 'Content-Type: application/json' -d '{\"msgtype\": \"markdown\",\"markdown\": {\"title\":"
        send_content0="【${model}】正在启动编译！请稍后大约4小时..."
        markdown_splitline="\n\n---\n\n"
        GITHUB_WORKFLOW_URL=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
        nowtime=`date "+%Y-%m-%d %H:%M:%S"`
        eval "$send_dingding \"${send_content0}\",\"text\":\"${nowtime} $markdown_splitline #### <font color=#6A65FF>${send_content0}</font>\n\n[点此链接查看](${GITHUB_WORKFLOW_URL})\"}}'"
        
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        sed -n -r '/^CONFIG_TARGET.*DEVICE.*=y/{s/.*DEVICE_([^_]+_[^_]+)_.*=y/\1/p;q}' .config > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Upload firmware to my NAS
      id: zz-nas
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_ZZNAS == 'true' && !cancelled()
      run: |
        send_dingding="curl -s \"https://oapi.dingtalk.com/robot/send?access_token=${whkey}\" -H 'Content-Type: application/json' -d '{\"msgtype\": \"markdown\",\"markdown\": {\"title\":"
        send_content1="【${model}】【${model2}】编译成功！正在上传固件到NAS..."
        send_content2="【${model}】【${model2}】编译成功！固件成功上传到NAS。"
        markdown_splitline="\n\n---\n\n"
        GITHUB_WORKFLOW_URL=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
        nowtime=`date "+%Y-%m-%d %H:%M:%S"`
        eval "$send_dingding \"${send_content1}\",\"text\":\"${nowtime} $markdown_splitline #### <font color=#6A65FF>${send_content1}</font>\n\n[点此链接查看](${GITHUB_WORKFLOW_URL})\"}}'"
        
        cd openwrt/bin/targets/*/*
        echo $ftp_psw > /tmp/rsync.psw && chmod 600 /tmp/rsync.psw

        transfer_with_retry() {
          local file="$1"
          local target="$2"
          local retries=3
          local attempt=1
              
          if [[ -z "$file" ]]; then
            echo "⚠️  Skipping empty file parameter"
            return 0
          fi
              
          if ! ls $file >/dev/null 2>&1; then
            echo "⚠️  File(s) matching '$file' not found, skipping"
            return 0
          fi
              
          while true; do
            echo "🚀 Attempt $attempt: Transferring $file to $target"
            if rsync -avzP --partial "$file" "$target" --password-file=/tmp/rsync.psw; then
              echo "✅ Successfully transferred $file"
              return 0
            fi
                  
            if [[ $attempt -ge $retries ]]; then
              echo "❌ Critical failure: $file failed after $retries attempts"
              return 1
            fi
                  
            echo "⚠️  Failed attempt $attempt for $file. Retrying in 5 seconds..."
            sleep 5
            ((attempt++))
          done
        }
          
        transfer_group() {
          local target="$1"
          shift
          local files=("$@")
          local error_occurred=0
              
          echo "===================== Transferring to $target ====================="
              
          for file in "${files[@]}"; do
            if ! transfer_with_retry "$file" "$target"; then
              error_occurred=1
              echo "❌ File $file failed, skipping but continuing with others"
            fi
          done
              
          return $error_occurred
        }
          
        timestamp=$(date +"%Y.%m.%d-%H%M")
        target1="$ftp_username@$ftp_ip::$TargetPath/$timestamp/"
        target2="$ftp_username@$ftp_ip::$TargetPath2/$timestamp/"
          
        group1=("$upload_file_1" "$upload_file_2" "$upload_file_5")
        group2=("$upload_file_3" "$upload_file_4" "$upload_file_5")
          
        transfer_group "$target1" "${group1[@]}" || {
          echo "⚠️  One or more files in group 1 failed"
        }
          
        transfer_group "$target2" "${group2[@]}" || {
          echo "⚠️  One or more files in group 2 failed"
        }
          
        rm -f /tmp/rsync.psw
        echo "===================== Transfer Completed ====================="
        nowtime=`date "+%Y-%m-%d %H:%M:%S"`
        eval "$send_dingding \"${send_content2}\",\"text\":\"${nowtime} $markdown_splitline #### <font color=#92D050>${send_content2}</font>\n\n[点此链接查看](${GITHUB_WORKFLOW_URL})\"}}'"
        echo "::warning file=zz-nas.com::All Released Files Uploaded to ZZ-NAS"

    # OTA 标准化检查：release 必须含 360T7 的 OTA 关键产物（手动下载 + 未来客户端 OTA）
    - name: Check OTA critical files
      id: otafiles
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        cd "$FIRMWARE"
        echo "===== OTA 关键产物检查（360T7 + sha256sums） ====="
        fail=0
        for f in immortalwrt-mediatek-filogic-qihoo_360t7_108M-squashfs-sysupgrade.bin sha256sums; do
          if [ -s "$f" ]; then
            echo "✔ $f ($(du -h "$f" | cut -f1))"
          else
            echo "::error::缺少 OTA 关键文件 $f"
            fail=1
          fi
        done
        if [ -f sha256sums ] && ! grep -q "immortalwrt-mediatek-filogic-qihoo_360t7_108M-squashfs-sysupgrade.bin" sha256sums; then
          echo "::error::sha256sums 未包含 360T7 sysupgrade 镜像"
          fail=1
        fi
        [ "$fail" -eq 0 ] || exit 1
        echo "===== 本次 release 全部产物 ====="
        ls -lh

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.otafiles.outcome == 'success' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 版本号取 DIY 打进固件的 Ryyyy-mm-dd（与刷机后显示的版本一致）
        VER=$(grep -oE 'R[0-9]{4}-[0-9]{2}-[0-9]{2}' openwrt/package/emortal/default-settings/files/99-default-settings 2>/dev/null | head -n1)
        if [ -z "$VER" ]; then
          echo "::error::无法从 99-default-settings 解析固件版本日期"
          exit 1
        fi
        TAG="OP_MT7981_${VER}"
        echo "release_tag=$TAG" >> $GITHUB_OUTPUT
        echo "===== Release Tag: $TAG ====="
        # 同一天重复构建：删除当天旧 release（连同 tag 与旧产物），覆盖当天前一个
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "已存在 $TAG，删除旧 release 及 tag 以覆盖当天前一个产物"
          gh release delete "$TAG" --yes --cleanup-tag
        fi
        if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
          git push origin --delete "refs/tags/$TAG"
        fi
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*


    # OTA last_build.txt 写回（浏览器 raw 免配额直读；编译+发版成功才写，失败不阻断发版）
    - name: Update last_build.txt (MT7981)
      if: success() && env.UPLOAD_RELEASE == 'true' && steps.otafiles.outcome == 'success'
      continue-on-error: true
      run: |
        # 版本日期与 tag 步同源：99-default-settings 的 R 日期（CST 盖章值，非 date 现算）
        VER=$(grep -oE 'R[0-9]{4}-[0-9]{2}-[0-9]{2}' openwrt/package/emortal/default-settings/files/99-default-settings 2>/dev/null | head -n1 || true)
        VER=${VER#R}
        if ! echo "$VER" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
          echo "::error::无法解析固件版本日期，跳过 last_build.txt"
          exit 1
        fi
        DATE="$VER"
        SIZE=$("$FIRMWARE/immortalwrt-mediatek-filogic-qihoo_360t7_108M-squashfs-sysupgrade.bin" 2>/dev/null || echo 0)
        PUB=$(date -u +%FT%TZ)
        LINE="MT7981=$DATE $SIZE $PUB"
        if [ -f last_build.txt ]; then
          awk -v k="MT7981=" -v l="$LINE" 'index($0,k)==1{print l;f=1;next} {print} END{if(!f)print l}' last_build.txt > last_build.txt.tmp && mv last_build.txt.tmp last_build.txt
        else
          printf '%s\n' "$LINE" > last_build.txt
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add last_build.txt
        if git diff --cached --quiet; then echo "last_build.txt 已是最新"; exit 0; fi
        git commit -m "chore(ota): update last_build MT7981=$DATE"
        # 前面步骤可能改动过跟踪文件（如 chmod +x DIY 脚本会翻转可执行位=未暂存改动）
        # → 复位跟踪文件（CI 工作区一次性；last_build.txt 已提交不受影响），保证 rebase 干净
        git checkout -- . || true
        git pull --rebase origin "${GITHUB_REF_NAME}"
        git push origin "HEAD:${GITHUB_REF_NAME}"
    - name: Delete workflow runs
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: Prune orphan tags (tag cap = 30)
      if: ${{ !cancelled() }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        python3 - <<'PY'
        import os, json, urllib.request, urllib.parse, subprocess
        repo = os.environ['GITHUB_REPOSITORY']
        tok = os.environ['GH_TOKEN']
        def get(u):
            req = urllib.request.Request(u, headers={'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json'})
            return json.load(urllib.request.urlopen(req))
        rels = get('https://api.github.com/repos/%s/releases?per_page=100' % repo)
        reltags = set(r['tag_name'] for r in rels)
        out = subprocess.run(['git', 'ls-remote', '--tags', 'origin'], capture_output=True, text=True).stdout
        tags = [l.split('refs/tags/')[1] for l in out.splitlines() if 'refs/tags/' in l and '^{}' not in l]
        orphans = [t for t in tags if t not in reltags]
        print('tags=%d releases=%d orphans=%d' % (len(tags), len(reltags), len(orphans)))
        for t in orphans:
            req = urllib.request.Request('https://api.github.com/repos/%s/git/refs/tags/%s' % (repo, urllib.parse.quote(t, safe='')), headers={'Authorization': 'Bearer ' + tok}, method='DELETE')
            try:
                urllib.request.urlopen(req)
                print('del tag', t)
            except Exception as e:
                print('del fail', t, e)
        PY
    - name: Enforce workflow runs cap (30)
      if: ${{ !cancelled() }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
      run: |
        python3 - <<'PY'
        import os, json, urllib.request, urllib.parse
        repo = os.environ['GITHUB_REPOSITORY']
        ref = os.environ.get('GITHUB_WORKFLOW_REF', '')
        wf = ref.split('/.github/workflows/')[-1].split('@')[0]
        tok = os.environ['GH_TOKEN']
        def get(u):
            req = urllib.request.Request(u, headers={'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json'})
            return json.load(urllib.request.urlopen(req))
        runs = get('https://api.github.com/repos/%s/actions/workflows/%s/runs?per_page=100' % (repo, urllib.parse.quote(wf)))['workflow_runs']
        extra = runs[30:]
        print('runs=%d over30=%d' % (len(runs), len(extra)))
        for r in extra:
            req = urllib.request.Request('https://api.github.com/repos/%s/actions/runs/%s' % (repo, r['id']), headers={'Authorization': 'Bearer ' + tok}, method='DELETE')
            try:
                urllib.request.urlopen(req)
                print('deleted', r['id'])
            except Exception as e:
                print('del fail', r['id'], e)
        PY
    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.1.0
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 30
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
